name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bundle the latest website for offline use
        run: |
          mkdir -p app/src/main/assets/site/icons
          curl -fsSL https://aquasense-vit.github.io/index.html -o app/src/main/assets/site/index.html
          for f in icon-192.png icon-512.png favicon-48.png apple-touch-icon.png; do
            curl -fsSL "https://aquasense-vit.github.io/icons/$f" -o "app/src/main/assets/site/icons/$f"
          done

      - name: Build the APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk AquaSense.apk
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" AquaSense.apk --title "AquaSense $TAG" --latest \
            --notes "AquaSense Android app. Download AquaSense.apk on your phone and open it. If Android asks, allow installing apps from this source. The app always shows the latest version of the website."

      - uses: actions/upload-artifact@v4
        with:
          name: AquaSense-apk
          path: AquaSense.apk
